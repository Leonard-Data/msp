<!-- Forms & inputs component — load via fetch and innerHTML -->
<h2 class="section-title">Buttons</h2>
<div class="demo-row">
  <button class="btn btn-primary">Submit</button>
  <button class="btn btn-ghost">Cancel</button>
  <button class="btn btn-link">Learn more</button>
  <button class="btn btn-primary btn-sm">Small</button>
  <button class="btn btn-ghost btn-sm" disabled style="opacity:0.5;cursor:not-allowed">Disabled</button>
</div>

<h2 class="section-title">Badges &amp; Pills</h2>
<div class="demo-row">
  <span class="badge badge-blue">New</span>
  <span class="badge badge-gray">Draft</span>
  <span class="badge badge-green">Active</span>
  <span class="badge badge-orange">Warning</span>
  <span class="pill">01 / 07</span>
  <span class="pill">Guide</span>
  <span class="pill">API</span>
</div>

<h2 class="section-title">Form Example</h2>
<div class="form-card">
  <div class="field">
    <label for="name-ui">Full name</label>
    <input type="text" id="name-ui" placeholder="Jane Doe" />
  </div>
  <div class="group">
    <div class="field">
      <label for="email-ui">Email</label>
      <input type="email" id="email-ui" placeholder="jane@example.com" />
    </div>
    <div class="field">
      <label for="role-ui">Role</label>
      <select id="role-ui">
        <option>AI Engineer</option>
        <option>ML Engineer</option>
        <option>Software Engineer</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label for="message-ui">Message</label>
    <textarea id="message-ui" placeholder="Tell us about your project..."></textarea>
  </div>
  <div class="switch-row">
    <label class="switch">
      <input type="checkbox" />
      <span class="slider"></span>
    </label>
    <span style="font-size:14px">Subscribe to newsletter</span>
  </div>
  <div style="margin-top:16px">
    <button class="btn btn-primary">Send message</button>
  </div>
</div>
