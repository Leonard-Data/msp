name: Sync documentation sources

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.MSP_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit regenerated content
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .tmp src/generated public/_sources
          if git diff --cached --quiet; then
            echo "No sync changes"
            exit 0
          fi
          git commit -m "chore: sync documentation sources"
          git push
